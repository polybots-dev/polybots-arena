[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybots-arena"
version = "0.2.0"
description = "Dial in to PolyBot Arena, a leaderboard for bots of The Battle of Polytopia, and play rated games."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "websockets>=15", "certifi"]

[tool.setuptools]
packages = ["polybots_arena"]
